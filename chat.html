<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentic Bot — Chat</title>

    <!-- Bootstrap 5 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <!-- App styles -->
    <link rel="stylesheet" href="assets/css/global.css" />
    <link rel="stylesheet" href="assets/css/chat.css" />
  </head>
  <body>
    <!-- Toast container -->
    <div id="toastContainer" aria-live="polite" aria-atomic="true"></div>

    <!-- ── App shell ───────────────────────────────────────── -->
    <div class="chat-layout">
      <!-- ── Sidebar ──────────────────────────────────────── -->
      <aside
        class="sidebar"
        id="sidebar"
        role="navigation"
        aria-label="Sidebar"
      >
        <div class="sidebar-header">
          <div class="sidebar-logo"><i class="bi bi-stars"></i></div>
          <span class="sidebar-title">Agentic Bot</span>
        </div>

        <div class="sidebar-body">
          <!-- New chat -->
          <button
            class="sidebar-item mb-3"
            id="newChatBtn"
            title="Start a new chat"
          >
            <i class="bi bi-plus-circle"></i> New Chat
          </button>

          <div class="sidebar-section-label">Recent</div>

          <!-- History placeholder items (purely decorative in this demo) -->
          <button class="sidebar-item active">
            <i class="bi bi-chat-text"></i>
            <span class="text-truncate">Current Session</span>
          </button>
        </div>

        <div class="sidebar-footer">
          <div class="user-info">
            <div class="user-avatar" id="userAvatar">U</div>
            <span class="user-name" id="userNameDisplay">User</span>
            <button class="sidebar-action-btn" id="logoutBtn" title="Sign out">
              <i class="bi bi-box-arrow-right"></i>
            </button>
          </div>
        </div>
      </aside>

      <!-- ── Main ──────────────────────────────────────────── -->
      <main class="chat-main">
        <!-- Top navbar -->
        <header class="chat-navbar">
          <button
            class="navbar-icon-btn"
            id="sidebarToggle"
            title="Toggle sidebar"
            aria-label="Toggle sidebar"
          >
            <i class="bi bi-layout-sidebar-inset"></i>
          </button>

          <span class="navbar-title">Chat</span>

          <!-- Theme toggle -->
          <button
            class="navbar-icon-btn"
            id="themeToggle"
            title="Toggle theme"
            aria-label="Toggle theme"
          >
            <i class="bi bi-sun-fill"></i>
          </button>
        </header>

        <!-- Messages -->
        <div
          class="messages-container"
          id="messagesContainer"
          role="log"
          aria-live="polite"
          aria-label="Chat messages"
        >
          <!-- Messages are injected by chat.js -->
        </div>

        <!-- Input area -->
        <div class="chat-input-area">
          <div class="input-box" role="region" aria-label="Message input">
            <textarea
              id="chatInput"
              class="chat-textarea"
              placeholder="Message Agentic Bot…"
              rows="1"
              aria-label="Type a message"
            ></textarea>

            <!-- Voice button -->
            <button
              class="input-btn voice-btn"
              id="voiceBtn"
              type="button"
              title="Voice input"
              aria-label="Voice input"
            >
              <i class="bi bi-mic-fill"></i>
            </button>

            <!-- Send button -->
            <button
              class="input-btn send-btn"
              id="sendBtn"
              type="button"
              title="Send message"
              aria-label="Send message"
            >
              <i class="bi bi-send-fill"></i>
            </button>
          </div>

          <p class="input-hint">
            Press <kbd>Enter</kbd> to send &middot;
            <kbd>Shift&nbsp;+&nbsp;Enter</kbd> for new line
          </p>
        </div>
      </main>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chat logic (ES module) -->
    <script type="module" src="assets/js/chat.js"></script>

    <!-- Set first letter of username in avatar -->
    <script type="module">
      import CONFIG from "./assets/js/config.js";
      const name =
        localStorage.getItem(CONFIG.LOCAL_STORAGE_KEYS.SESSION_NAME) || "U";
      const el = document.getElementById("userAvatar");
      if (el) el.textContent = name.charAt(0).toUpperCase();
    </script>
  </body>
</html>
