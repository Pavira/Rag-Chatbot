[project]
name = "rag-backend"
version = "0.1.0"
description = "RAG Backend using FastAPI, Gemini, PGVector, and BM25"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # =========================================================
    # FastAPI
    # =========================================================
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",

    # =========================================================
    # Database
    # =========================================================
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",
    "pgvector==0.2.5",

    # =========================================================
    # LangChain Ecosystem
    # =========================================================
    "langchain==0.3.27",
    "langchain-core==0.3.72",
    "langchain-community==0.3.27",
    "langchain-google-genai==2.1.9",

    # =========================================================
    # Gemini SDK
    # =========================================================
    "google-genai==1.30.0",

    # =========================================================
    # HTTP Client
    # =========================================================
    "httpx==0.28.1",

    # =========================================================
    # PDF Processing
    # =========================================================
    "pymupdf==1.27.2.3",

    # =========================================================
    # Data Processing
    # =========================================================
    "numpy==2.1.3",
    "pandas==2.3.2",
    "scikit-learn==1.7.1",

    # =========================================================
    # Document Processing
    # =========================================================
    "python-docx==1.2.0",

    # =========================================================
    # BM25 Retrieval
    # =========================================================
    "rank-bm25==0.2.2",

    # =========================================================
    # Validation & Settings
    # =========================================================
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",

    # =========================================================
    # Utilities
    # =========================================================
    "python-dotenv==1.0.1",
    "python-multipart==0.0.9",
    "tiktoken==0.9.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"